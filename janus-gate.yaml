# =============================================================
#  janus-gate  -  ESP32-S3 DevKitC-1 N16R8
#  RF / Wi-Fi controller for two independent drives
# =============================================================
#  GARAGE  - driven by a 3 V RF remote whose battery has been
#            replaced by the ESP32 rail. The ESP shorts the
#            remote's own button contacts through optocouplers,
#            so the gate still sees a remote it already knows.
#            STATUS: working (stages 2, 3, 6).
#
#  GATE    - driven directly by a CC1101 433 MHz transceiver
#            replaying the captured frame of a second remote.
#            STATUS: not implemented yet (stage 5).
#
#  Both paths are fully local. Neither Wi-Fi nor Home Assistant
#  is in the control chain - the physical switches work with the
#  network down, which is the whole point of the device.
#
#  BEFORE EVERY FLASH:
#  disconnect the remote from the optocouplers. GPIO states are
#  undefined during boot and you can fire the garage by accident.
#
#  HARDWARE NOTE - OPTOCOUPLER JUMPERS:
#  The per-channel jumpers on both PC817 modules must stay REMOVED.
#  With the jumpers fitted the channels are permanently triggered,
#  which holds a remote button down and locks up the encoder.
# =============================================================

substitutions:
  device_name: "janus-gate"

  # Pulse width for shorting the remote contacts.
  # 400ms works on this remote. Raise to 600-800ms if the drive
  # starts ignoring commands.
  pulse: "400ms"

  # How long the garage door is ASSUMED to keep moving after a
  # command. Real travel is about 30s; the margin is deliberate.
  # Too long costs one wasted press. Too short makes the ESP think
  # the door is idle while it still moves, so the opposite command
  # would reverse the drive under load instead of stopping it.
  travel_time: "45s"

esphome:
  name: ${device_name}
  friendly_name: "Janus Gate"

esp32:
  board: esp32-s3-devkitc-1
  flash_size: 16MB
  framework:
    type: esp-idf

# Note: this board has 8 MB octal PSRAM (N16R8 variant), but the
# project does not need it. The psram: section is deliberately
# omitted - a wrong PSRAM config can cause a boot loop.
# GPIO 33-37 are wired to PSRAM in hardware either way - keep clear.

logger:
  level: DEBUG

api:
  encryption:
    key: !secret api_key
  # Without Home Assistant on the network, the api component would
  # reboot the ESP every 15 minutes. Remove this line once HA is
  # connected to restore the default watchdog behaviour.
  reboot_timeout: 0s

ota:
  - platform: esphome
    password: !secret ota_password

wifi:
  ssid: !secret wifi_ssid
  password: !secret wifi_password

  # Fallback access point in case the credentials are wrong.
  # Connect to it with a phone and fix the config from there.
  ap:
    ssid: "Janus Gate Fallback"
    password: !secret fallback_password

captive_portal:

# Test panel served at the device IP.
# Works without Home Assistant - this is the bench test interface.
web_server:
  port: 80

# =============================================================
#  WIRING MAP
# =============================================================
#
#  GARAGE  -  remote 1 (3 V, four buttons) via PC817
#
#  FUNCTION | GPIO | WIRE COLOUR | MODULE | CHANNEL
#  ---------+------+-------------+--------+--------
#  Stop     |   4  | grey        | Opto 1 |    2
#  Open     |   5  | white       | Opto 1 |    1
#  Close    |   6  | yellow      | Opto 2 |    1
#  Lock     |   7  | orange      | Opto 2 |    2
#
#  GPIO -> IN+ on the PC817 module
#  GND  -> IN- on the PC817 module
#
#  The transistor side goes to the remote's button contacts:
#  collector to the pad measured at the higher potential,
#  emitter to the lower one. The transistor side needs no ground.
#
#  ---------------------------------------------------------------
#  PHYSICAL SWITCHES  (ON-OFF-ON, momentary both ways, DPDT)
#
#  Six pins means two independent poles sharing one lever.
#  Only one pole is used: centre pin to GND, the two outer pins
#  to their GPIOs. The second pole stays unconnected.
#  The centre OFF position is the resting state - nothing fires.
#
#  SWITCH | POSITION | GPIO | ACTION
#  -------+----------+------+------------------------------------
#  Garage | up       |  15  | cmd_garage_open
#  Garage | down     |  16  | cmd_garage_close
#  Gate   | up       |  17  | reserved - stage 5 (CC1101)
#  Gate   | down     |  18  | reserved - stage 5 (CC1101)
#
#  ---------------------------------------------------------------
#  CC1101 433 MHz  -  stage 5, not wired into the logic yet
#
#  CSN 10, MOSI 11, SCK 12, MISO 13, GDO0 9, GDO2 8
#  VCC to 3.3 V - never 5 V. Antenna fitted before any transmit.
# =============================================================

# -------------------------------------------------------------
#  ASSUMED GARAGE STATE
# -------------------------------------------------------------
#  The ESP has no feedback from the drive - it only knows what it
#  sent itself. This is an assumption, not a measurement, and it
#  can drift if someone uses the original remote or the door
#  stalls on an obstacle.
#
#  The failure modes are asymmetric and that is what makes this
#  worth doing: a stale "moving" state costs one extra press,
#  because Stop on a stationary door does nothing. A stale "idle"
#  state simply behaves like no logic at all. There is no case
#  that is worse than not having this feature.
# -------------------------------------------------------------

globals:
  # 0 = idle, 1 = opening, 2 = closing
  - id: garage_dir
    type: int
    restore_value: false
    initial_value: '0'

output:
  # Stop  -  grey wire  -  Opto 1, channel 2
  - platform: gpio
    pin: GPIO4
    id: opto_garage_stop

  # Open  -  white wire  -  Opto 1, channel 1
  - platform: gpio
    pin: GPIO5
    id: opto_garage_open

  # Close  -  yellow wire  -  Opto 2, channel 1
  - platform: gpio
    pin: GPIO6
    id: opto_garage_close

  # Lock  -  orange wire  -  Opto 2, channel 2
  - platform: gpio
    pin: GPIO7
    id: opto_garage_lock

# =============================================================
#  SCRIPTS  -  garage
# =============================================================
#  send_*  are primitives: they only pulse an optocoupler.
#  cmd_*   carry the direction logic and call the primitives.
#  Keeping them separate avoids recursion and leaves the raw
#  pulses reachable for debugging.
# =============================================================

script:
  # --- Primitives ---------------------------------------------

  - id: send_garage_open
    mode: single
    then:
      - output.turn_on: opto_garage_open
      - delay: ${pulse}
      - output.turn_off: opto_garage_open

  - id: send_garage_close
    mode: single
    then:
      - output.turn_on: opto_garage_close
      - delay: ${pulse}
      - output.turn_off: opto_garage_close

  # Stop also clears the assumed state - the door is standing
  # still afterwards no matter what we believed before.
  - id: send_garage_stop
    mode: single
    then:
      - script.stop: garage_travel_timer
      - lambda: 'id(garage_dir) = 0;'
      - output.turn_on: opto_garage_stop
      - delay: ${pulse}
      - output.turn_off: opto_garage_stop

  - id: send_garage_lock
    mode: single
    then:
      - script.stop: garage_travel_timer
      - lambda: 'id(garage_dir) = 0;'
      - output.turn_on: opto_garage_lock
      - delay: ${pulse}
      - output.turn_off: opto_garage_lock

  # --- Assumed movement window --------------------------------

  # mode: restart - a new command restarts the countdown.
  - id: garage_travel_timer
    mode: restart
    then:
      - delay: ${travel_time}
      - lambda: 'id(garage_dir) = 0;'

  # --- Direction logic ----------------------------------------

  # Opposite direction while moving sends Stop instead.
  # This drive reverses immediately on the opposite command,
  # which is hard on the motor and gearbox under load, so
  # inserting a Stop protects the mechanics as well as matching
  # what the user actually meant.
  #
  # Pressing the SAME direction again just repeats the command
  # and restarts the window. Harmless on this drive.

  - id: cmd_garage_open
    mode: single
    then:
      - if:
          condition:
            lambda: 'return id(garage_dir) == 2;'
          then:
            - logger.log: "Garage closing - sending Stop instead of Open"
            - script.execute: send_garage_stop
          else:
            - lambda: 'id(garage_dir) = 1;'
            - script.execute: garage_travel_timer
            - script.execute: send_garage_open

  - id: cmd_garage_close
    mode: single
    then:
      - if:
          condition:
            lambda: 'return id(garage_dir) == 1;'
          then:
            - logger.log: "Garage opening - sending Stop instead of Close"
            - script.execute: send_garage_stop
          else:
            - lambda: 'id(garage_dir) = 2;'
            - script.execute: garage_travel_timer
            - script.execute: send_garage_close

# =============================================================
#  PHYSICAL SWITCHES  -  work with no Wi-Fi and no Home Assistant
# =============================================================

binary_sensor:
  # --- Garage switch - wired to the logic ---------------------

  - platform: gpio
    pin:
      number: GPIO15
      mode:
        input: true
        pullup: true
      inverted: true
    name: "Garage switch up"
    id: sw_garage_up
    entity_category: diagnostic
    filters:
      - delayed_on: 30ms
    on_press:
      - script.execute: cmd_garage_open

  - platform: gpio
    pin:
      number: GPIO16
      mode:
        input: true
        pullup: true
      inverted: true
    name: "Garage switch down"
    id: sw_garage_down
    entity_category: diagnostic
    filters:
      - delayed_on: 30ms
    on_press:
      - script.execute: cmd_garage_close

  # --- Gate switch - wired to GPIO, no action yet -------------
  #
  # No on_press until the CC1101 transmit path exists (stage 5).
  # These entities exist so the wiring can be verified now:
  # flip the lever and watch the state change in the web panel.

  - platform: gpio
    pin:
      number: GPIO17
      mode:
        input: true
        pullup: true
      inverted: true
    name: "Gate switch up"
    id: sw_gate_up
    entity_category: diagnostic
    filters:
      - delayed_on: 30ms

  - platform: gpio
    pin:
      number: GPIO18
      mode:
        input: true
        pullup: true
      inverted: true
    name: "Gate switch down"
    id: sw_gate_down
    entity_category: diagnostic
    filters:
      - delayed_on: 30ms

# =============================================================
#  BUTTONS
# =============================================================
#  Primary controls go through the direction logic.
#  The (direct) ones bypass it and pulse the optocoupler raw -
#  useful when the state machine and reality disagree.
# =============================================================

button:
  - platform: template
    name: "Garage open"
    id: button_garage_open
    icon: "mdi:garage-open-variant"
    on_press:
      - script.execute: cmd_garage_open

  - platform: template
    name: "Garage close"
    id: button_garage_close
    icon: "mdi:garage-variant"
    on_press:
      - script.execute: cmd_garage_close

  - platform: template
    name: "Garage stop"
    id: button_garage_stop
    icon: "mdi:stop-circle-outline"
    on_press:
      - script.execute: send_garage_stop

  # CAUTION: on most drives "Lock" disables the motor and can make
  # it ignore every remote until it is unlocked. Consider hiding
  # this entity or putting it behind a confirmation in HA.
  - platform: template
    name: "Garage lock"
    id: button_garage_lock
    icon: "mdi:lock-alert-outline"
    on_press:
      - script.execute: send_garage_lock

  # --- Raw pulses, no direction logic -------------------------

  - platform: template
    name: "Garage open (direct)"
    id: button_garage_open_raw
    icon: "mdi:flash-outline"
    entity_category: diagnostic
    on_press:
      - script.execute: send_garage_open

  - platform: template
    name: "Garage close (direct)"
    id: button_garage_close_raw
    icon: "mdi:flash-outline"
    entity_category: diagnostic
    on_press:
      - script.execute: send_garage_close

  # Forces the assumed state back to idle without touching the
  # drive. Use when the ESP and reality have drifted apart.
  - platform: template
    name: "Reset assumed state"
    id: button_reset_state
    icon: "mdi:backup-restore"
    entity_category: diagnostic
    on_press:
      - script.stop: garage_travel_timer
      - lambda: 'id(garage_dir) = 0;'

# -------------------------------------------------------------
#  DIAGNOSTICS
# -------------------------------------------------------------

sensor:
  - platform: wifi_signal
    name: "Wi-Fi signal"
    update_interval: 60s

  - platform: uptime
    name: "Uptime"

text_sensor:
  - platform: wifi_info
    ip_address:
      name: "IP address"

  # What the ESP believes the garage door is doing.
  # An assumption, not a measurement - see the note above.
  - platform: template
    name: "Garage assumed movement"
    id: garage_assumed_movement
    icon: "mdi:garage-alert-variant"
    update_interval: 1s
    lambda: |-
      switch (id(garage_dir)) {
        case 1: return {"opening"};
        case 2: return {"closing"};
        default: return {"idle"};
      }

# =============================================================
#  PINS RESERVED FOR LATER STAGES - DO NOT REUSE
# =============================================================
#  Stage 5  CC1101:  CSN 10, MOSI 11, SCK 12, MISO 13,
#                    GDO0 9, GDO2 8
#  Stage 7  RFID reader:  14, 21, 42
#
#  Reserved in hardware / avoid:
#  26-32 flash, 33-37 octal PSRAM, 0/3/45/46 strapping,
#  19/20 USB-JTAG, 43/44 UART0, 38 or 48 RGB LED
# =============================================================