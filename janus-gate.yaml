# =============================================================
#  janus-gate  -  ESP32-S3 DevKitC-1 N16R8
#  RF / Wi-Fi controller for two independent drives
# =============================================================
#  GARAGE  - driven by a 3 V RF remote whose battery has been
#            replaced by the ESP32 rail. The ESP shorts the
#            remote's own button contacts through optocouplers,
#            so the drive still sees a remote it already knows.
#            STATUS: working (stages 2, 3, 6).
#
#  GATE    - driven by a CC1101 433 MHz transceiver replaying a
#            raw OOK frame LEARNED FROM THE ORIGINAL REMOTE on
#            the device itself. No code is baked into firmware.
#            STATUS: implemented, codes not yet learned.
#
#  STAGE 9 (soldered onto perfboard) is done.
#
#  Both paths are fully local. Neither Wi-Fi nor Home Assistant
#  is in the control chain - the physical switches work with the
#  network down, which is the whole point of the device.
#
#  BEFORE EVERY FLASH:
#  disconnect the remote from the optocouplers. GPIO states are
#  undefined during boot and you can fire the garage by accident.
#
#  HARDWARE NOTE - OPTOCOUPLER JUMPERS:
#  The per-channel jumpers on both PC817 modules must stay REMOVED.
#  With the jumpers fitted the channels are permanently triggered,
#  which holds a remote button down and locks up the encoder.
#
#  HARDWARE NOTE - TOGGLE LEVER INVERSION:
#  A toggle lever pivots, so pushing it UP closes the contact on
#  the LOWER side of the body. The GPIO assignments below are by
#  LEVER POSITION as the user experiences it, which is the
#  opposite of the terminal position on the switch body.
# =============================================================

substitutions:
  device_name: "janus-gate"

  # --- Garage (optocoupler path) ------------------------------

  # Pulse width for shorting the remote contacts.
  # 400ms works on this remote. Raise to 600-800ms if the drive
  # starts ignoring commands.
  pulse: "400ms"

  # How long the garage door is ASSUMED to keep moving after a
  # command. Real travel is about 30s; the margin is deliberate.
  # Too long costs one wasted press. Too short makes the ESP think
  # the door is idle while it still moves, so the opposite command
  # would reverse the drive under load instead of stopping it.
  travel_time: "45s"

  # --- Gate (CC1101 path) -------------------------------------

  # Most 433 MHz gate remotes sit here. A few use 433.42 MHz.
  # This CANNOT be changed without reflashing, so if learning
  # fails on site with no signal at all, suspect this first.
  # Mitigation: build a 433.42 firmware too and keep the .bin on
  # a phone - it can be flashed from the web panel on site.
  rf_frequency: "433.92MHz"

  # How many times a learned frame is repeated on transmit.
  # Original remotes send the same frame several times; a lone
  # frame is often ignored by the receiver.
  rf_repeats: "8"

  # Assumed travel time for the gate. Unknown until measured on
  # site - start generous and shorten once the real figure is
  # known. Same asymmetry as the garage: too long costs a press,
  # too short lets an opposite command reverse the drive.
  gate_travel_time: "45s"

  # Learn mode needs TWO matching frames, so the window has to be
  # long enough to hold the remote button down for a moment.
  learn_timeout: "60s"

esphome:
  name: ${device_name}
  friendly_name: "Janus Gate"

esp32:
  board: esp32-s3-devkitc-1
  flash_size: 16MB
  framework:
    type: esp-idf

# Note: this board has 8 MB octal PSRAM (N16R8 variant), but the
# project does not need it. The psram: section is deliberately
# omitted - a wrong PSRAM config can cause a boot loop.
# GPIO 33-37 are wired to PSRAM in hardware either way - keep clear.

logger:
  level: DEBUG

api:
  encryption:
    key: !secret api_key
  # Without Home Assistant on the network, the api component would
  # reboot the ESP every 15 minutes. Remove this line once HA is
  # connected to restore the default watchdog behaviour.
  reboot_timeout: 0s

ota:
  - platform: esphome
    password: !secret ota_password
  # Firmware upload straight from the web panel - no laptop and no
  # ESPHome toolchain needed on site. Build the .bin at home, keep
  # it on a phone, upload it through the browser if needed.
  - platform: web_server

wifi:
  ssid: !secret wifi_ssid
  password: !secret wifi_password

  # THIS IS THE ON-SITE ACCESS PATH.
  # Away from the home network the ESP serves its own AP. Join it
  # with a phone and browse to 192.168.4.1 to reach the panel and
  # run the learning procedure. Test this before going on site.
  ap:
    ssid: "Janus Gate Fallback"
    password: !secret fallback_password

captive_portal:

web_server:
  port: 80

# =============================================================
#  WIRING MAP
# =============================================================
#
#  GARAGE  -  remote 1 (3 V, four buttons) via PC817
#
#  FUNCTION | GPIO | WIRE COLOUR | MODULE | CHANNEL
#  ---------+------+-------------+--------+--------
#  Stop     |   4  | grey        | Opto 1 |    2
#  Open     |   5  | white       | Opto 1 |    1
#  Close    |   6  | yellow      | Opto 2 |    1
#  Lock     |   7  | orange      | Opto 2 |    2
#
#  GPIO -> IN+ on the PC817 module
#  GND  -> IN- on the PC817 module
#  Transistor side to the remote contacts: collector to the pad
#  at the higher potential, emitter to the lower. No ground.
#
#  ---------------------------------------------------------------
#  PHYSICAL SWITCHES  (ON-OFF-ON momentary, DPDT - one pole used)
#  Centre pin to GND, the two outer pins to their GPIOs.
#  See the lever inversion note in the header.
#
#  SWITCH | LEVER | GPIO | ACTION
#  -------+-------+------+----------------------------------------
#  Garage | up    |  15  | cmd_garage_open
#  Garage | down  |  16  | cmd_garage_close
#  Gate   | up    |  17  | cmd_gate_open
#  Gate   | down  |  18  | cmd_gate_close
#
#  ---------------------------------------------------------------
#  CC1101 433 MHz  -  Ebyte E07-M1101D-SMA pinout
#
#  PIN | SIGNAL | ESP32-S3 | NOTE
#  ----+--------+----------+----------------------------------
#   1  | GND    |   GND    |
#   2  | VCC    |   3.3 V  | never 5 V, own branch from the
#      |        |          | DevKit 3V3 pin, not daisy-chained
#      |        |          | behind the remote
#   3  | GDO0   |  GPIO9   | transmit data
#   4  | CSN    |  GPIO10  |
#   5  | SCK    |  GPIO12  |
#   6  | MOSI   |  GPIO11  |
#   7  | MISO   |  GPIO13  |
#   8  | GDO2   |  GPIO8   | receive data
#   9  | GND    |    -     | optional extra ground
#  10  | GND    |    -     | optional extra ground
#
#  NOTE: pins 7 and 8 are swapped relative to the common generic
#  CC1101 breakout, which puts GDO2 on 7 and MISO on 8. Always
#  check against the datasheet for the module in hand. Pin 1 is
#  GND and has continuity with the SMA connector shell - that is
#  the reliable way to orient the header.
#
#  100 nF + 47 uF across VCC and GND, as close to the header as
#  possible. Antenna fitted before power-up.
# =============================================================

spi:
  clk_pin: GPIO12
  mosi_pin: GPIO11
  miso_pin: GPIO13

# -------------------------------------------------------------
#  CC1101 radio front end
# -------------------------------------------------------------
#  gdo0_pin is deliberately NOT set in this block. It is only
#  used for the FIFO-mode RX interrupt, and setting it re-routes
#  the pad away from the RMT peripheral, which silently kills
#  transmit - the chip enters TX but nothing reaches the air.
#  Dual-pin wiring keeps TX on GDO0 and RX on GDO2 instead.
#
#  filter_bandwidth is at the minimum. An OOK receiver with AGC
#  always hears something when no one is transmitting, and wider
#  bandwidth simply lets in more noise power. 58 kHz is plenty
#  for a fixed-code remote and keeps the noise floor down.
# -------------------------------------------------------------

cc1101:
  id: radio
  cs_pin: GPIO10
  frequency: ${rf_frequency}
  modulation_type: ASK/OOK
  filter_bandwidth: 200kHz
  rx_attenuation: 0dB
  output_power: 10

# -------------------------------------------------------------
#  RECEIVER
# -------------------------------------------------------------
#  dump: raw rather than all. The "all" setting also runs the
#  infrared decoders - Pronto and Beo4 in particular will happily
#  "recognise" pure noise and bury the log in megabytes of hex.
#  Raw replay does not need any decoder anyway.
#
#  filter: 250us discards short noise spikes. A real fixed-code
#  remote uses pulses around 300-500 us, so nothing real is lost.
# -------------------------------------------------------------

remote_receiver:
  id: rf_rx
  pin: GPIO8
  filter: 100us
  idle: 6ms
  buffer_size: 10000b
  tolerance: 50%
  on_raw:
    then:
      # ---------------------------------------------------------
      #  TWO-FRAME CONFIRMATION
      # ---------------------------------------------------------
      #  A single frame is not trusted. The receiver picks up
      #  background noise constantly, and noise can easily be long
      #  enough to look like a code - so accepting the first frame
      #  would mean storing junk before the remote is even pressed.
      #
      #  A real remote sends the same frame several times per
      #  press. Noise never repeats. So the first usable frame is
      #  only held as a candidate, and a code is stored only once
      #  a second frame arrives that matches it within tolerance.
      #
      #  In practice: hold the remote button down for a moment
      #  rather than tapping it.
      # ---------------------------------------------------------
      - lambda: |-
          if (id(learn_target) == 0) return;

          size_t n = x.size();
          if (n < 24 || n > 128) return;

          bool match = false;
          if ((size_t) id(cand_len) == n) {
            match = true;
            for (size_t i = 0; i < n; i++) {
              int32_t a = id(cand_code)[i];
              int32_t b = x[i];
              // Sign carries mark vs space - never mix them up.
              if ((a < 0) != (b < 0)) { match = false; break; }
              int32_t da = a < 0 ? -a : a;
              int32_t db = b < 0 ? -b : b;
              int32_t diff = da > db ? da - db : db - da;
              // A quarter of the pulse width plus a flat 60 us.
              // Loose enough for receiver jitter, tight enough
              // that two different noise bursts never agree.
              if (diff > da / 4 + 60) { match = false; break; }
            }
          }

          if (!match) {
            id(cand_len) = n;
            for (size_t i = 0; i < n; i++) id(cand_code)[i] = x[i];
            ESP_LOGD("learn", "Candidate: %u pulses - press again to confirm",
                     (unsigned) n);
            return;
          }

          int32_t *dst = nullptr;
          const char *label = "";
          switch (id(learn_target)) {
            case 1: dst = id(code_gate_open);  label = "OPEN";
                    id(len_gate_open)  = n; break;
            case 2: dst = id(code_gate_close); label = "CLOSE";
                    id(len_gate_close) = n; break;
            case 3: dst = id(code_gate_stop);  label = "STOP";
                    id(len_gate_stop)  = n; break;
            default: return;
          }
          for (size_t i = 0; i < n; i++) dst[i] = x[i];

          ESP_LOGI("learn", "CONFIRMED %s: %u pulses", label, (unsigned) n);
          id(learn_target) = 0;
          id(cand_len) = 0;

      # Only stops the window once the lambda above disarmed
      # learn mode, i.e. after a confirmed capture.
      - if:
          condition:
            lambda: 'return id(learn_target) == 0;'
          then:
            - script.stop: learn_timeout_timer

remote_transmitter:
  id: rf_tx
  pin: GPIO9
  # OOK has no sub-carrier - the RF carrier is simply keyed on
  # and off, so the data line must be driven solid, not chopped.
  carrier_duty_percent: 100%

# =============================================================
#  STATE
# =============================================================
#  Learned frames live in NVS and survive a reboot, so the codes
#  are captured once on site and never again. 128 pulses is
#  comfortably more than a 24-bit fixed-code frame needs.
# =============================================================

globals:
  # --- Garage: assumed movement -------------------------------
  #  The ESP has no feedback from the drive - it only knows what
  #  it sent itself. The failure modes are asymmetric and that is
  #  what makes this worth doing: a stale "moving" state costs one
  #  extra press, because Stop on a stationary door does nothing.
  #  A stale "idle" state behaves like no logic at all.
  #  0 = idle, 1 = opening, 2 = closing
  - id: garage_dir
    type: int
    restore_value: false
    initial_value: '0'

  # --- Gate: assumed movement ---------------------------------
  #  Same reasoning as the garage above. Unlike the garage there
  #  is a second failure mode: if the STOP code was never learned
  #  there is nothing to send, so cmd_gate_* falls back to sending
  #  the requested direction rather than doing nothing at all.
  #  0 = idle, 1 = opening, 2 = closing
  - id: gate_dir
    type: int
    restore_value: false
    initial_value: '0'

  # --- Gate: learn mode target --------------------------------
  #  0 = off, 1 = open, 2 = close, 3 = stop
  - id: learn_target
    type: int
    restore_value: false
    initial_value: '0'

  # --- Gate: candidate frame awaiting confirmation ------------
  #  Deliberately NOT restored - a half-finished capture must
  #  never survive a reboot.
  - id: cand_code
    type: int32_t[128]
    restore_value: false
  - id: cand_len
    type: int
    restore_value: false
    initial_value: '0'

  # --- Gate: learned frames -----------------------------------
  - id: code_gate_open
    type: int32_t[128]
    restore_value: true
  - id: len_gate_open
    type: int
    restore_value: true
    initial_value: '0'

  - id: code_gate_close
    type: int32_t[128]
    restore_value: true
  - id: len_gate_close
    type: int
    restore_value: true
    initial_value: '0'

  - id: code_gate_stop
    type: int32_t[128]
    restore_value: true
  - id: len_gate_stop
    type: int
    restore_value: true
    initial_value: '0'

output:
  # Stop  -  grey wire  -  Opto 1, channel 2
  - platform: gpio
    pin: GPIO4
    id: opto_garage_stop

  # Open  -  white wire  -  Opto 1, channel 1
  - platform: gpio
    pin: GPIO5
    id: opto_garage_open

  # Close  -  yellow wire  -  Opto 2, channel 1
  - platform: gpio
    pin: GPIO6
    id: opto_garage_close

  # Lock  -  orange wire  -  Opto 2, channel 2
  - platform: gpio
    pin: GPIO7
    id: opto_garage_lock

# =============================================================
#  SCRIPTS
# =============================================================
#  send_*  are primitives: they pulse an optocoupler or key the
#          radio. cmd_* carry logic and call the primitives.
#  Keeping them separate avoids recursion and leaves the raw
#  actions reachable for debugging.
# =============================================================

script:
  # ---------------------------------------------------------
  #  GARAGE
  # ---------------------------------------------------------

  - id: send_garage_open
    mode: single
    then:
      - output.turn_on: opto_garage_open
      - delay: ${pulse}
      - output.turn_off: opto_garage_open

  - id: send_garage_close
    mode: single
    then:
      - output.turn_on: opto_garage_close
      - delay: ${pulse}
      - output.turn_off: opto_garage_close

  # Stop also clears the assumed state - the door is standing
  # still afterwards no matter what we believed before.
  - id: send_garage_stop
    mode: single
    then:
      - script.stop: garage_travel_timer
      - lambda: 'id(garage_dir) = 0;'
      - output.turn_on: opto_garage_stop
      - delay: ${pulse}
      - output.turn_off: opto_garage_stop

  - id: send_garage_lock
    mode: single
    then:
      - script.stop: garage_travel_timer
      - lambda: 'id(garage_dir) = 0;'
      - output.turn_on: opto_garage_lock
      - delay: ${pulse}
      - output.turn_off: opto_garage_lock

  # mode: restart - a new command restarts the countdown.
  - id: garage_travel_timer
    mode: restart
    then:
      - delay: ${travel_time}
      - lambda: 'id(garage_dir) = 0;'

  # Opposite direction while moving sends Stop instead. This
  # drive reverses immediately on the opposite command, which is
  # hard on the motor and gearbox under load, so inserting a Stop
  # protects the mechanics as well as matching intent.
  # Pressing the SAME direction again just repeats the command.
  - id: cmd_garage_open
    mode: single
    then:
      - if:
          condition:
            lambda: 'return id(garage_dir) == 2;'
          then:
            - logger.log: "Garage closing - sending Stop instead of Open"
            - script.execute: send_garage_stop
          else:
            - lambda: 'id(garage_dir) = 1;'
            - script.execute: garage_travel_timer
            - script.execute: send_garage_open

  - id: cmd_garage_close
    mode: single
    then:
      - if:
          condition:
            lambda: 'return id(garage_dir) == 1;'
          then:
            - logger.log: "Garage opening - sending Stop instead of Close"
            - script.execute: send_garage_stop
          else:
            - lambda: 'id(garage_dir) = 2;'
            - script.execute: garage_travel_timer
            - script.execute: send_garage_close

  # ---------------------------------------------------------
  #  GATE  -  replay of learned frames
  # ---------------------------------------------------------
  #  send_gate_* are the raw primitives - they key the radio and
  #  nothing else. The anti-reverse logic lives in cmd_gate_*
  #  below, mirroring the garage.

  - id: send_gate_open
    mode: single
    then:
      - if:
          condition:
            lambda: 'return id(len_gate_open) == 0;'
          then:
            - logger.log: "Gate OPEN not learned yet - nothing sent"
          else:
            - remote_transmitter.transmit_raw:
                code: !lambda |-
                  return std::vector<int32_t>(
                    id(code_gate_open),
                    id(code_gate_open) + id(len_gate_open));
                repeat:
                  times: ${rf_repeats}
                  wait_time: 10ms

  - id: send_gate_close
    mode: single
    then:
      - if:
          condition:
            lambda: 'return id(len_gate_close) == 0;'
          then:
            - logger.log: "Gate CLOSE not learned yet - nothing sent"
          else:
            - remote_transmitter.transmit_raw:
                code: !lambda |-
                  return std::vector<int32_t>(
                    id(code_gate_close),
                    id(code_gate_close) + id(len_gate_close));
                repeat:
                  times: ${rf_repeats}
                  wait_time: 10ms

  - id: send_gate_stop
    mode: single
    then:
      - if:
          condition:
            lambda: 'return id(len_gate_stop) == 0;'
          then:
            - logger.log: "Gate STOP not learned yet - nothing sent"
          else:
            - script.stop: gate_travel_timer
            - lambda: 'id(gate_dir) = 0;'
            - remote_transmitter.transmit_raw:
                code: !lambda |-
                  return std::vector<int32_t>(
                    id(code_gate_stop),
                    id(code_gate_stop) + id(len_gate_stop));
                repeat:
                  times: ${rf_repeats}
                  wait_time: 10ms

  # ---------------------------------------------------------
  #  GATE  -  direction logic
  # ---------------------------------------------------------
  #  Mirrors the garage: the opposite direction while moving
  #  sends Stop instead of reversing the drive under load.
  #
  #  IMPORTANT DIFFERENCE: the gate's Stop is a learned RF code,
  #  not a hard-wired contact, so it may not exist. When it has
  #  not been learned the fallback is to send the requested
  #  direction anyway - doing nothing would be worse than the
  #  reverse this logic is meant to prevent.

  - id: gate_travel_timer
    mode: restart
    then:
      - delay: ${gate_travel_time}
      - lambda: 'id(gate_dir) = 0;'

  - id: cmd_gate_open
    mode: single
    then:
      - if:
          condition:
            lambda: 'return id(gate_dir) == 2 && id(len_gate_stop) > 0;'
          then:
            - logger.log: "Gate closing - sending Stop instead of Open"
            - script.stop: gate_travel_timer
            - lambda: 'id(gate_dir) = 0;'
            - script.execute: send_gate_stop
          else:
            - if:
                condition:
                  lambda: 'return id(gate_dir) == 2;'
                then:
                  - logger.log: "Gate closing but no Stop code learned - sending Open anyway"
            - lambda: 'id(gate_dir) = 1;'
            - script.execute: gate_travel_timer
            - script.execute: send_gate_open

  - id: cmd_gate_close
    mode: single
    then:
      - if:
          condition:
            lambda: 'return id(gate_dir) == 1 && id(len_gate_stop) > 0;'
          then:
            - logger.log: "Gate opening - sending Stop instead of Close"
            - script.stop: gate_travel_timer
            - lambda: 'id(gate_dir) = 0;'
            - script.execute: send_gate_stop
          else:
            - if:
                condition:
                  lambda: 'return id(gate_dir) == 1;'
                then:
                  - logger.log: "Gate opening but no Stop code learned - sending Close anyway"
            - lambda: 'id(gate_dir) = 2;'
            - script.execute: gate_travel_timer
            - script.execute: send_gate_close

  # ---------------------------------------------------------
  #  GATE  -  learning
  # ---------------------------------------------------------
  #  Arm a slot, then HOLD the matching button on the original
  #  remote for a moment. Two matching frames are required before
  #  anything is stored - see the note on the receiver above.
  #  Raw timings are stored rather than a decoded protocol, so
  #  this works even for encodings no decoder recognises.

  - id: learn_timeout_timer
    mode: restart
    then:
      - delay: ${learn_timeout}
      - lambda: |-
          if (id(learn_target) != 0) {
            ESP_LOGW("learn", "Learn mode timed out - nothing stored");
            id(learn_target) = 0;
            id(cand_len) = 0;
          }

binary_sensor:
  # --- Garage switch ------------------------------------------

  - platform: gpio
    pin:
      number: GPIO15
      mode:
        input: true
        pullup: true
      inverted: true
    name: "Garage switch up"
    id: sw_garage_up
    entity_category: diagnostic
    filters:
      - delayed_on: 30ms
    on_press:
      - script.execute: cmd_garage_open

  - platform: gpio
    pin:
      number: GPIO16
      mode:
        input: true
        pullup: true
      inverted: true
    name: "Garage switch down"
    id: sw_garage_down
    entity_category: diagnostic
    filters:
      - delayed_on: 30ms
    on_press:
      - script.execute: cmd_garage_close

  # --- Gate switch --------------------------------------------

  - platform: gpio
    pin:
      number: GPIO17
      mode:
        input: true
        pullup: true
      inverted: true
    name: "Gate switch up"
    id: sw_gate_up
    entity_category: diagnostic
    filters:
      - delayed_on: 30ms
    on_press:
      - script.execute: cmd_gate_open

  - platform: gpio
    pin:
      number: GPIO18
      mode:
        input: true
        pullup: true
      inverted: true
    name: "Gate switch down"
    id: sw_gate_down
    entity_category: diagnostic
    filters:
      - delayed_on: 30ms
    on_press:
      - script.execute: cmd_gate_close

  # --- Learned code presence ----------------------------------

  - platform: template
    name: "Gate open learned"
    id: has_gate_open
    entity_category: diagnostic
    lambda: 'return id(len_gate_open) > 0;'

  - platform: template
    name: "Gate close learned"
    id: has_gate_close
    entity_category: diagnostic
    lambda: 'return id(len_gate_close) > 0;'

  - platform: template
    name: "Gate stop learned"
    id: has_gate_stop
    entity_category: diagnostic
    lambda: 'return id(len_gate_stop) > 0;'

button:
  # --- Garage -------------------------------------------------

  - platform: template
    name: "Garage open"
    id: button_garage_open
    icon: "mdi:garage-open-variant"
    on_press:
      - script.execute: cmd_garage_open

  - platform: template
    name: "Garage close"
    id: button_garage_close
    icon: "mdi:garage-variant"
    on_press:
      - script.execute: cmd_garage_close

  - platform: template
    name: "Garage stop"
    id: button_garage_stop
    icon: "mdi:stop-circle-outline"
    on_press:
      - script.execute: send_garage_stop

  # CAUTION: on most drives "Lock" disables the motor and can make
  # it ignore every remote until it is unlocked. Consider hiding
  # this entity or putting it behind a confirmation in HA.
  - platform: template
    name: "Garage lock"
    id: button_garage_lock
    icon: "mdi:lock-alert-outline"
    on_press:
      - script.execute: send_garage_lock

  # --- Gate ---------------------------------------------------

  - platform: template
    name: "Gate open"
    id: button_gate_open
    icon: "mdi:gate-open"
    on_press:
      - script.execute: cmd_gate_open

  - platform: template
    name: "Gate close"
    id: button_gate_close
    icon: "mdi:gate"
    on_press:
      - script.execute: cmd_gate_close

  - platform: template
    name: "Gate stop"
    id: button_gate_stop
    icon: "mdi:stop-circle-outline"
    on_press:
      - script.execute: send_gate_stop

  # --- Learning -----------------------------------------------
  #  Press one of these, then HOLD the matching button on the
  #  original remote close to the antenna. Watch "Learn mode":
  #  it goes from "waiting" to "candidate held" to idle, and the
  #  pulse count below shows what was stored.

  - platform: template
    name: "Learn gate open"
    id: button_learn_open
    icon: "mdi:school-outline"
    on_press:
      - lambda: |-
          id(learn_target) = 1;
          id(cand_len) = 0;
      - logger.log: "Learn ARMED for OPEN - hold the remote button"
      - script.execute: learn_timeout_timer

  - platform: template
    name: "Learn gate close"
    id: button_learn_close
    icon: "mdi:school-outline"
    on_press:
      - lambda: |-
          id(learn_target) = 2;
          id(cand_len) = 0;
      - logger.log: "Learn ARMED for CLOSE - hold the remote button"
      - script.execute: learn_timeout_timer

  - platform: template
    name: "Learn gate stop"
    id: button_learn_stop
    icon: "mdi:school-outline"
    on_press:
      - lambda: |-
          id(learn_target) = 3;
          id(cand_len) = 0;
      - logger.log: "Learn ARMED for STOP - hold the remote button"
      - script.execute: learn_timeout_timer

  - platform: template
    name: "Cancel learning"
    id: button_learn_cancel
    icon: "mdi:close-circle-outline"
    entity_category: diagnostic
    on_press:
      - lambda: |-
          id(learn_target) = 0;
          id(cand_len) = 0;
      - script.stop: learn_timeout_timer
      - logger.log: "Learn mode cancelled"

  # Wipes all three learned frames. There is no undo - the codes
  # have to be learned from the original remote again.
  - platform: template
    name: "Forget all gate codes"
    id: button_forget_all
    icon: "mdi:delete-forever-outline"
    entity_category: diagnostic
    on_press:
      - lambda: |-
          id(len_gate_open) = 0;
          id(len_gate_close) = 0;
          id(len_gate_stop) = 0;
          ESP_LOGW("learn", "All gate codes erased");

  # --- Diagnostics --------------------------------------------

  - platform: template
    name: "Garage open (direct)"
    id: button_garage_open_raw
    icon: "mdi:flash-outline"
    entity_category: diagnostic
    on_press:
      - script.execute: send_garage_open

  - platform: template
    name: "Garage close (direct)"
    id: button_garage_close_raw
    icon: "mdi:flash-outline"
    entity_category: diagnostic
    on_press:
      - script.execute: send_garage_close

  - platform: template
    name: "Gate open (direct)"
    id: button_gate_open_raw
    icon: "mdi:flash-outline"
    entity_category: diagnostic
    on_press:
      - script.execute: send_gate_open

  - platform: template
    name: "Gate close (direct)"
    id: button_gate_close_raw
    icon: "mdi:flash-outline"
    entity_category: diagnostic
    on_press:
      - script.execute: send_gate_close

  # Forces both assumed states back to idle without touching
  # either drive. Use when the ESP and reality have drifted apart.
  - platform: template
    name: "Reset assumed state"
    id: button_reset_state
    icon: "mdi:backup-restore"
    entity_category: diagnostic
    on_press:
      - script.stop: garage_travel_timer
      - script.stop: gate_travel_timer
      - lambda: |-
          id(garage_dir) = 0;
          id(gate_dir) = 0;

sensor:
  - platform: wifi_signal
    name: "Wi-Fi signal"
    update_interval: 60s

  - platform: uptime
    name: "Uptime"

  # Pulse counts of the stored frames. A plausible fixed-code
  # frame lands somewhere around 25-100 pulses. This is the only
  # way to tell a real capture from stored junk while on site.
  - platform: template
    name: "Gate open pulses"
    id: pulses_gate_open
    entity_category: diagnostic
    accuracy_decimals: 0
    update_interval: 5s
    lambda: 'return id(len_gate_open);'

  - platform: template
    name: "Gate close pulses"
    id: pulses_gate_close
    entity_category: diagnostic
    accuracy_decimals: 0
    update_interval: 5s
    lambda: 'return id(len_gate_close);'

  - platform: template
    name: "Gate stop pulses"
    id: pulses_gate_stop
    entity_category: diagnostic
    accuracy_decimals: 0
    update_interval: 5s
    lambda: 'return id(len_gate_stop);'

  # Live view of the frame waiting for confirmation. Useful on
  # site: if this keeps jumping to different values, the receiver
  # is chewing on noise rather than the remote.
  - platform: template
    name: "Candidate pulses"
    id: pulses_candidate
    entity_category: diagnostic
    accuracy_decimals: 0
    update_interval: 1s
    lambda: 'return id(cand_len);'

text_sensor:
  - platform: wifi_info
    ip_address:
      name: "IP address"

  # What the ESP believes the garage door is doing.
  # An assumption, not a measurement - see the note above.
  - platform: template
    name: "Garage assumed movement"
    id: garage_assumed_movement
    icon: "mdi:garage-alert-variant"
    update_interval: 1s
    lambda: |-
      switch (id(garage_dir)) {
        case 1: return {"opening"};
        case 2: return {"closing"};
        default: return {"idle"};
      }

  - platform: template
    name: "Gate assumed movement"
    id: gate_assumed_movement
    icon: "mdi:gate-arrow-right"
    update_interval: 1s
    lambda: |-
      switch (id(gate_dir)) {
        case 1: return {"opening"};
        case 2: return {"closing"};
        default: return {"idle"};
      }

  - platform: template
    name: "Learn mode"
    id: learn_mode_state
    icon: "mdi:school-outline"
    update_interval: 1s
    lambda: |-
      if (id(learn_target) == 0) return {"idle"};
      std::string what;
      switch (id(learn_target)) {
        case 1: what = "OPEN";  break;
        case 2: what = "CLOSE"; break;
        case 3: what = "STOP";  break;
      }
      if (id(cand_len) > 0) return {"candidate held - " + what};
      return {"waiting for " + what};

# =============================================================
#  PINS RESERVED FOR LATER STAGES - DO NOT REUSE
# =============================================================
#  Stage 7  RFID reader:  14, 21, 42
#
#  Reserved in hardware / avoid:
#  26-32 flash, 33-37 octal PSRAM, 0/3/45/46 strapping,
#  19/20 USB-JTAG, 43/44 UART0, 38 or 48 RGB LED
# =============================================================