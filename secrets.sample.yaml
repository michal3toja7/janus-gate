# =============================================================
#  janus-gate  -  secrets template
# =============================================================
#  Copy this file to secrets.yaml and fill in every value:
#
#      cp secrets.sample.yaml secrets.yaml
#
#  secrets.yaml is gitignored and must never be committed.
#  THIS file is the template and is meant to be public - keep
#  real values out of it.
#
#  All seven keys below are required. A missing one fails the
#  build with "Secret not found", not at runtime.
# =============================================================

# --- Wi-Fi ---------------------------------------------------
#  Must be a 2.4 GHz network. The ESP32 has no 5 GHz radio and
#  will not even see such a network when it scans.
wifi_ssid: "YOUR_NETWORK_NAME"
wifi_password: "YOUR_WIFI_PASSWORD"

# --- Home Assistant API key ----------------------------------
#  32 random bytes, base64. Generate one with:
#
#      openssl rand -base64 32
#
#  Home Assistant asks for this same value when it adopts the
#  device: Settings -> Devices & Services -> ESPHome.
#
#  The placeholder below deliberately fails the build with
#  "Invalid key format" - that is by design, so a dummy key can
#  never reach a flashed device. Generate a real one first.
api_key: "YOUR_GENERATED_BASE64_KEY"

# --- OTA update password -------------------------------------
#  Required for flashing over Wi-Fi, which is every flash after
#  the first one. The first flash has to go over USB, through
#  the UART port on the DevKitC-1 - not the native USB port.
ota_password: "YOUR_OTA_PASSWORD"

# --- Fallback access point password --------------------------
#  Minimum 8 characters. Used when the ESP cannot join your
#  Wi-Fi and serves its own "Janus Gate Fallback" network
#  instead. That AP is also the on-site access path: it is how
#  the device is reached at the gate to learn remote codes.
#
#  MAKE THIS LONG AND RANDOM, not memorable. The AP is visible
#  from outside the building whenever the main Wi-Fi is down,
#  and whoever joins it reaches the panel that opens the gate.
fallback_password: "YOUR_FALLBACK_PASSWORD"

# --- Web panel login -----------------------------------------
#  HTTP basic auth on the built-in web server.
#
#  Stated plainly: there is no TLS on this device, so these
#  credentials cross the network in the clear. They deter casual
#  access on a trusted LAN and are not protection against anyone
#  already inside it. Do not reuse a password that matters
#  somewhere else.
web_username: "admin"
web_password: "YOUR_WEB_PASSWORD"
