# =============================================================
#  SECRETS  -  fill in every field below
# =============================================================
#  This file must never reach the repository. See .gitignore
# =============================================================

# --- Wi-Fi -----------------------------------------------------
# Must be a 2.4 GHz network. The ESP32 cannot see 5 GHz.
wifi_ssid: "YOUR_NETWORK_NAME"
wifi_password: "YOUR_PASSWORD"

# --- Home Assistant API key ------------------------------------
# Generate with:  openssl rand -base64 32
api_key: "YOUR_GENERATED_BASE64_KEY"

# --- OTA update password ---------------------------------------
# Any password you choose. Required for flashing over Wi-Fi,
# which is every flash after the first one.
ota_password: "YOUR_OTA_PASSWORD"

# --- Fallback access point password ----------------------------
# Minimum 8 characters. Used when the ESP cannot join your Wi-Fi
# and falls back to serving its own "Janus Gate Fallback" network.
fallback_password: "YOUR_FALLBACK_PASSWORD"


web_username: "admin"
web_password: "your_password"